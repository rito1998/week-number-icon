name: Automatic build release on tag

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Zig compiler
        uses: mlugg/setup-zig@v2.2.1

      - name: Build MSIX bundles
        run: zig build msix --release=safe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix-bundle
          path: zig-out/msix/*.msixbundle

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: msix-bundle
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/*.msixbundle
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_ONLY_CONTENTS }}
